# Central configuration for the AfriMeet AI pipeline.
# Loaded via afrimeet.utils.config.load_config().

seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  models_baseline: models/baseline
  models_finetuned: models/finetuned
  reports_metrics: reports/metrics
  reports_figures: reports/figures

data:
  # Hugging Face datasets used for Phase 2 (public data).
  #
  # Common Voice supplies training volume/diversity (crowdsourced, many speakers).
  # FLEURS contributes ONLY its test split, used purely as a held-out evaluation
  # benchmark — never trained on — so WER/CER are comparable to Whisper's own
  # published FLEURS numbers. build_dataset() in afrimeet/models/train.py combines
  # every dataset's `train` split for training and every dataset's `test` split for
  # eval, so this split split across datasets is what makes that separation work.
  #
  # NOTE: as of October 2025, Mozilla pulled the official mozilla-foundation/common_voice_*
  # datasets off Hugging Face entirely (moved to "Mozilla Data Collective", which isn't
  # usable via the `datasets` library / download.py's load_dataset() flow). Using
  # fsicoli/common_voice_15_0 instead — an actively-used community mirror of Common Voice
  # 15.0 (741GB across 100+ languages, CC-0, ungated, same audio+sentence schema).
  # If Mozilla ships an API-accessible route through Data Collective later, swap back to
  # an official source; for now this is the only practical way to get Common Voice
  # Swahili data through this pipeline. NOTE: this mirror still ships a legacy Python
  # loading script, so requirements/ml.txt pins `datasets<3.0` — see the comment there.
  datasets:
    - name: fsicoli/common_voice_15_0
      config: sw          # Swahili
      splits: [train]
    - name: google/fleurs
      config: sw_ke
      splits: [test]
  sample_rate: 16000
  max_audio_seconds: 30

whisper:
  baseline_model: openai/whisper-small
  finetuned_model_name: afrimeet-whisper-small-sw-en
  language: sw
  task: transcribe

training:
  learning_rate: 1.0e-5
  train_batch_size: 8
  eval_batch_size: 8
  num_train_epochs: 3
  warmup_steps: 500
  fp16: true
  gradient_checkpointing: true
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2   # bounds local disk use; older checkpoints are deleted automatically
  logging_steps: 50

evaluation:
  metrics: [wer, cer]
